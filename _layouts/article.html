---
layout: default
---
<div class="post">
  <p class="back"><a href="{{ "/" | relative_url }}">← 返回全部文章</a></p>
  {% if page.cover %}<img class="cover" src="{{ site.url }}{{ site.baseurl }}/{{ page.cover }}" alt="{{ page.title }}">{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
  {% if page.mp_url %}<p class="mp"><a class="btn" href="{{ page.mp_url }}" target="_blank" rel="noopener">读公众号原文 →</a></p>{% endif %}
  <div class="content">
    {{ content }}
  </div>
</div>
