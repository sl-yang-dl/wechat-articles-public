<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#ef5b3b">
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{{ page.title | default: site.title }}</title>
<style>
:root{
  --ink:#2b2622; --muted:#8a8079; --line:#f0e9e4;
  --brand:#ef5b3b; --brand-soft:#fdeee9; --bg:#fffdfb; --card:#ffffff;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;}

/* 顶部导航 */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,253,251,.88);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;}
.topbar .brand{font-weight:800;font-size:19px;letter-spacing:.5px;color:var(--brand);}
.topbar .brand small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px;letter-spacing:0;}
.topbar .pill{background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;white-space:nowrap;}

/* Hero */
.hero{background:linear-gradient(135deg,#fff1ec,#ffe2d4);padding:46px 0 40px;}
.hero .wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;}
.hero h1{font-size:36px;margin:0 0 12px;letter-spacing:1px;}
.hero .tag{color:#a8644c;font-size:15px;margin:0;line-height:1.8;}
.qrcard{background:#fff;padding:12px;border-radius:18px;box-shadow:0 10px 30px rgba(239,91,59,.18);margin-left:auto;}
.qrcard img{width:128px;height:128px;border-radius:12px;display:block;}
.qrcard span{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:6px;}

/* 搜一搜条 */
.search{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ff6b4a,#ff8a65);color:#fff;border-radius:16px;padding:16px 22px;margin:26px 0;font-size:16px;box-shadow:0 8px 22px rgba(255,107,74,.28);}
.search b{font-size:18px;}

/* 区块标题 */
h2{font-size:22px;margin:38px 0 18px;display:flex;align-items:center;gap:10px;}
h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--brand);display:inline-block;}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .22s ease,box-shadow .22s ease;}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(0,0,0,.10);}
.card .thumb{aspect-ratio:2.35/1;background:#faf3ec;overflow:hidden;}
.card .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
.card .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.card .date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.3px;white-space:nowrap;}
.badge{align-self:flex-start;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;}
.card h3{margin:0;font-size:17px;line-height:1.5;}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1;line-height:1.65;}
.links{display:flex;gap:9px;margin-top:4px;}
.btn{background:var(--brand);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;display:inline-block;transition:filter .2s ease;}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand);}

/* 主题合集 */
ul.topics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
ul.topics li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.9;}
ul.topics .cat{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:700;padding:4px 12px;border-radius:999px;margin-right:10px;}
ul.topics a{color:var(--brand);font-weight:600;}
ul.topics a:hover{text-decoration:underline;}

/* 页脚 CTA */
footer.cta{background:linear-gradient(135deg,#fff1ec,#ffe2d4);margin-top:52px;}
.cta .wrap{padding:44px 18px;text-align:center;}
.cta p{margin:6px 0;color:#7a4a3a;}
.cta img{width:140px;height:140px;border-radius:18px;border:5px solid #fff;box-shadow:0 10px 28px rgba(239,91,59,.22);margin-top:16px;}

/* 文章页 */
.post{max-width:740px;margin:0 auto;padding:30px 18px 56px;}
.post .back{margin:0 0 18px;color:var(--muted);font-size:14px;}
.post .back a:hover{color:var(--brand);}
.post .cover{width:100%;height:auto;border-radius:20px;margin-bottom:22px;box-shadow:0 10px 28px rgba(0,0,0,.08);}
.post h1{font-size:30px;line-height:1.4;margin:0 0 10px;}
.post .postdate{color:var(--muted);font-size:14px;margin:0 0 16px;font-variant-numeric:tabular-nums;}
.post .summary{background:linear-gradient(135deg,#fff7f4,#fff);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:14px 18px;color:#6b554c;font-size:15px;margin:0 0 22px;line-height:1.8;}
.post .mp{margin:0 0 26px;}
.post .content{font-size:17px;line-height:1.95;color:#3a342f;}
.post .content p{margin:0 0 20px;}
.post .content img{max-width:100%;border-radius:14px;display:block;margin:22px auto;box-shadow:0 6px 18px rgba(0,0,0,.06);}
.post .content h2,.post .content h3{margin:30px 0 14px;line-height:1.5;}
.post .content blockquote{margin:20px 0;padding:14px 18px;background:#fff7f4;border-left:4px solid var(--brand);border-radius:0 12px 12px 0;color:#6b554c;}
.post .content code{background:#f4ece8;padding:2px 6px;border-radius:6px;font-size:.9em;}
.post .content ul,.post .content ol{margin:0 0 20px;padding-left:22px;}
.post .content li{margin:7px 0;line-height:1.8;}
.post .content table{border-collapse:collapse;width:100%;margin:0 0 22px;font-size:14px;}
.post .content th,.post .content td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;line-height:1.6;}
.post .content th{background:var(--brand-soft);color:var(--brand);font-weight:700;}
.post .content tr:nth-child(even) td{background:#fdf8f5;}

@media (max-width:560px){
  .hero h1{font-size:28px;}
  .qrcard{margin-left:0;}
  .search{font-size:14px;padding:14px 16px;}
}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "作业不慌记",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "description": "{{ site.description }}"
}
</script>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relative_url }}">作业不慌记<small>陪娃整理作业与错题</small></a>
    <span class="pill">🔍 微信搜一搜：作业不慌记</span>
  </div>
</div>
{{ content }}
</body>
</html>
